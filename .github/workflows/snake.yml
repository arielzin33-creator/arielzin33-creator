# Generates the contribution-graph snake animation.
# Output lands on an `output` branch, which the README reads from:
#   https://raw.githubusercontent.com/YourUsername/YourUsername/output/snake.svg
#
# Nothing to configure — `github.repository_owner` resolves to your username.

name: Generate snake animation

on:
  schedule:
    - cron: "0 3 * * *"       # daily at 03:00 UTC
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate the SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
